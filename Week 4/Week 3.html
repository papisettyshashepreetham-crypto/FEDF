<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            background-color: #ffffff;
            color: #000;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        button {
            background-color: #efefef;
            border: 1px solid #767676;
            border-radius: 2px;
            padding: 2px 8px;
            font-size: 13.3px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #e5e5e5;
        }

        button:active {
            background-color: #d5d5d5;
        }

        ul {
            list-style-type: disc;
            padding-left: 40px;
            margin-top: 10px;
        }

        li {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .loading-spinner {
            display: inline-block;
            margin-left: 10px;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>

    <h2>User Data Fetch Example</h2>
    
    <button onclick="loadUsers()">Load Users</button>
    <span id="status" class="loading-spinner"></span>

    <ul id="userList"></ul>

    <script>
        /**
         * ===============================================
         * TypeScript-like Interface (Conceptual)
         * interface User {
         * id: number;
         * name: string;
         * email: string;
         * }
         * ===============================================
         */

        // API Layer (Async Programming & Error Handling)
        const UserAPI = {
            fetchUsers: async function () {
                return new Promise((resolve, reject) => {
                    // Simulating a network delay of 2 seconds
                    setTimeout(() => {
                        const success = true; // Set to false to test Error Handling
                        
                        if (success) {
                            resolve([
                                { id: 1, name: "P Shashe Preetham", email: "papisettyshashepreetham@klh.edu.in" },
                                { id: 2, name: "Ch Sai Geethika", email: "saigeethika@klh.edu.in" },
                                { id: 3, name: "B Tanya Sri", email: "btanyasri@klh.edu.in" }
                            ]);
                        } else {
                            reject("Failed to fetch users from server.");
                        }
                    }, 2000);
                });
            }
        };

        // UI Layer (DOM Updates)
        const UI = {
            displayUsers(users) {
                const userList = document.getElementById("userList");
                userList.innerHTML = ""; // Clear existing list
                
                users.forEach(user => {
                    const li = document.createElement("li");
                    li.textContent = `${user.name} - ${user.email}`;
                    userList.appendChild(li);
                });
            },
            
            showLoading(isLoading) {
                const status = document.getElementById("status");
                status.textContent = isLoading ? "Loading..." : "";
            }
        };

        // Controller Layer (Orchestration)
        async function loadUsers() {
            try {
                console.log("Controller: Initiating user load...");
                UI.showLoading(true);
                
                // Wait for the API layer to return data
                const users = await UserAPI.fetchUsers();
                
                // Pass data to UI layer for rendering
                UI.displayUsers(users);
                
                console.log("Controller: Users loaded successfully");
            } catch (error) {
                // Error Handling logic
                console.error("Controller Error:", error);
                
                // Custom UI error response (message box instead of alert as per instructions)
                const userList = document.getElementById("userList");
                userList.innerHTML = `<li style="color: red; list-style: none;">Error: ${error}</li>`;
            } finally {
                UI.showLoading(false);
            }
        }
    </script>
</body>
</html>
